# Stage 4 (experiment) - CUDA graphs for decode WITHOUT torch.compile.
# Why: with default compilation vLLM left only 0.09 GiB for the KV cache on your 8 GB card (needs 0.38 GiB for
# 3072 tokens) and refused to start. Eager mode left 0.85 GiB. Compilation (mode) and CUDA graphs are separate
# switches: here we keep the eager-style memory profile (-cc.mode=none) and capture only the decode step as a
# CUDA graph (-cc.cudagraph_mode=full_decode_only). In your earlier log, capturing graphs cost just 0.06 GiB.
# Decode is where eager mode loses time (hundreds of tiny kernel launches per token at batch size 1).
#
# Use:   docker compose -f docker-compose.vllm.graphs.yml up -d
# Revert: docker compose -f docker-compose.vllm.eager.yml up -d   (the known-good configuration)
services:
  vllm:
    image: vllm/vllm-openai:v0.29.0-cu129
    container_name: secrag-vllm
    ipc: host
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${MODEL_DIR:-../models/llama31-8b-secure-awq}:/model:ro
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - VLLM_WSL2_ENABLE_PIN_MEMORY=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command:
      - /model
      - --served-model-name=secrag-llama
      - --dtype=float16
      - --max-model-len=3072
      - --gpu-memory-utilization=0.85
      - --max-num-seqs=2
      - --max-num-batched-tokens=2048
      - "-cc.mode=none"
      - "-cc.cudagraph_mode=full_decode_only"
      - --host=0.0.0.0
      - --port=8000
