# Stage 7 - the whole offline stack:  Open WebUI (:3000)  ->  orchestrator (:8100)  ->  vLLM (:8000, GPU)
#
#   Open WebUI sees ONE model, "secrag-rag". Every question goes to the orchestrator, which routes it, retrieves from the
#   local index, compresses context, calls vLLM (served name "secrag-llama"), and AST-checks code answers.
#   Images are pulled/built once while online; after that nothing here needs the internet.
#
# First time:  ./prep.sh   then   docker compose up -d --build        Stop: docker compose down
services:
  vllm:
    image: vllm/vllm-openai:v0.29.0-cu129
    container_name: secrag-vllm
    restart: unless-stopped
    ipc: host
    ports:
      - "127.0.0.1:8000:8000"          # debug / benchmark access from the host only
    volumes:
      - ${MODEL_DIR:-../models/llama31-8b-secure-awq}:/model:ro
    environment:
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - VLLM_WSL2_ENABLE_PIN_MEMORY=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    # Measured config for the 8 GB RTX 3080 Laptop (see Stage 4): decode-only CUDA graphs, no torch.compile.
    command:
      - /model
      - --served-model-name=secrag-llama
      - --dtype=float16
      - --max-model-len=3072
      - --gpu-memory-utilization=0.85
      - --max-num-seqs=2
      - --max-num-batched-tokens=2048
      - "-cc.mode=none"
      - "-cc.cudagraph_mode=full_decode_only"
      - --host=0.0.0.0
      - --port=8000
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 40
      start_period: 120s

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    image: secrag-orchestrator:local
    container_name: secrag-orchestrator
    restart: unless-stopped
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    depends_on:
      vllm:
        condition: service_healthy
    ports:
      - "127.0.0.1:8100:8100"
    environment:
      - SEC_ROOT=/srv/secrag
      - MODEL_DIR=/model                 # only tokenizer.json is read here (token counting for context budgets)
      - VLLM_URL=http://vllm:8000/v1
      - LLM_NAME=secrag-llama
      - LLM_REP=1.05
    volumes:
      - ../index:/srv/secrag/index                           # chroma + bm25.pkl (chroma writes its sqlite lock files)
      - ../models/rag_cache:/srv/secrag/models/rag_cache:ro  # embedding + reranker weights
      - ${MODEL_DIR:-../models/llama31-8b-secure-awq}:/model:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8100/health', timeout=5)"]
      interval: 15s
      timeout: 8s
      retries: 20
      start_period: 90s

  open-webui:
    image: ghcr.io/open-webui/open-webui:main      # after the first pull, pin the digest:  docker images --digests
    container_name: secrag-webui
    restart: unless-stopped
    depends_on:
      orchestrator:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      - OPENAI_API_BASE_URL=http://orchestrator:8100/v1
      - OPENAI_API_KEY=local-not-used
      - ENABLE_OLLAMA_API=false
      - WEBUI_AUTH=false                 # single-user laptop; only takes effect on a FRESH data volume
      - OFFLINE_MODE=true
      - HF_HUB_OFFLINE=1
      # background chores would each cost a generation on the single GPU; the orchestrator also short-circuits them
      - ENABLE_TITLE_GENERATION=false
      - ENABLE_TAGS_GENERATION=false
      - ENABLE_AUTOCOMPLETE_GENERATION=false
      - ENABLE_FOLLOW_UP_GENERATION=false
      - ENABLE_SEARCH_QUERY_GENERATION=false
      - ENABLE_RETRIEVAL_QUERY_GENERATION=false
      - ENABLE_COMMUNITY_SHARING=false
      - ANONYMIZED_TELEMETRY=false
      - DO_NOT_TRACK=true
      - SCARF_NO_ANALYTICS=true
    volumes:
      - openwebui-data:/app/backend/data

volumes:
  openwebui-data:
